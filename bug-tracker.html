<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defect Tracker — Ayotunde Aleem</title>
<meta name="description" content="A lightweight defect tracker demo — severity tiers, status board, CSV export. By Ayotunde Aleem, QA Engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12131A; --surface:#1B1D27; --surface-2:#20222E; --line:#2E313F;
    --text:#EDEEF3; --muted:#8B8FA3; --mint:#5EEAD4; --amber:#F2A65A; --rose:#F2789F; --blue:#8DA9FF;
    --mono:'JetBrains Mono', monospace; --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text); font-family:var(--sans); line-height:1.6;}
  a{color:var(--mint);}
  .wrap{max-width:1180px; margin:0 auto; padding:40px 24px 80px;}

  .back{font-family:var(--mono); font-size:13px; color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:24px;}
  .back:hover{color:var(--mint);}

  header{margin-bottom:28px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;}
  .eyebrow{font-family:var(--mono); font-size:12px; color:var(--amber); letter-spacing:1.5px; text-transform:uppercase; margin:0 0 8px;}
  h1{font-family:var(--mono); font-size:clamp(24px,4.5vw,34px); margin:0 0 8px; font-weight:800;}
  .sub{color:var(--muted); max-width:60ch; font-size:14.5px; margin:0;}

  button, select, input, textarea{font-family:var(--sans);}
  .btn{
    font-family:var(--mono); font-size:13px; padding:11px 20px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--text); cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  .btn.primary{background:var(--mint); color:var(--ink); border-color:var(--mint); font-weight:700;}
  .btn.primary:hover{background:#7ff2e2;}
  .btn:not(.primary):hover{border-color:var(--mint); color:var(--mint);}

  .toolbar{display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; align-items:center;}
  .toolbar select{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:12.5px; padding:9px 12px; border-radius:8px;
  }
  .toolbar .spacer{flex:1;}

  .board{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;}
  @media (max-width:900px){ .board{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .board{grid-template-columns:1fr;} }

  .col{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:120px;}
  .col-head{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--muted); margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .col-count{background:var(--surface-2); border-radius:20px; padding:2px 8px; font-size:11px;}

  .bug-card{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 13px; margin-bottom:10px; cursor:pointer; transition:border-color .15s ease;
  }
  .bug-card:hover{border-color:var(--mint);}
  .bug-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;}
  .bug-id{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .bug-title{font-size:13.5px; font-weight:600; margin:2px 0 6px; line-height:1.35;}
  .sev{
    font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:20px; white-space:nowrap; border:1px solid; flex-shrink:0;
  }
  .sev.critical{color:var(--rose); border-color:var(--rose);}
  .sev.high{color:var(--amber); border-color:var(--amber);}
  .sev.medium{color:var(--blue); border-color:var(--blue);}
  .sev.low{color:var(--muted); border-color:var(--muted);}
  .bug-date{font-family:var(--mono); font-size:10.5px; color:var(--muted);}

  .empty-col{color:var(--muted); font-family:var(--mono); font-size:12px; text-align:center; padding:20px 0;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    max-width:540px; width:100%; max-height:88vh; overflow-y:auto; padding:26px;
  }
  .modal h2{font-family:var(--mono); font-size:18px; margin:0 0 4px;}
  .modal .bug-id{margin-bottom:14px; display:block;}
  .field{margin-bottom:16px;}
  .field label{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:14px; padding:10px 12px;
  }
  .field textarea{min-height:70px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:space-between; margin-top:20px; gap:10px; flex-wrap:wrap;}
  .modal-actions .right{display:flex; gap:10px;}
  .close-x{
    position:absolute; top:16px; right:20px; background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer;
  }
  .modal-wrap{position:relative;}

  footer{margin-top:50px; text-align:center; color:var(--muted); font-family:var(--mono); font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back">&larr; back to portfolio</a>

  <header>
    <div>
      <p class="eyebrow">QA Tooling</p>
      <h1>Defect Tracker</h1>
      <p class="sub">A lightweight bug tracker demo — log defects, tier by severity, move through a real triage workflow. Saved locally in your browser.</p>
    </div>
    <button class="btn primary" id="newBugBtn">+ Log a defect</button>
  </header>

  <div class="toolbar">
    <select id="severityFilter">
      <option value="all">All severities</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <div class="spacer"></div>
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="btn" id="seedBtn">Load sample data</button>
    <button class="btn" id="resetBtn">Clear all</button>
  </div>

  <div class="board" id="board">
    <div class="col" data-status="new">
      <div class="col-head"><span>New</span><span class="col-count" data-count="new">0</span></div>
      <div class="col-body" data-body="new"></div>
    </div>
    <div class="col" data-status="in-progress">
      <div class="col-head"><span>In Progress</span><span class="col-count" data-count="in-progress">0</span></div>
      <div class="col-body" data-body="in-progress"></div>
    </div>
    <div class="col" data-status="fixed">
      <div class="col-head"><span>Fixed</span><span class="col-count" data-count="fixed">0</span></div>
      <div class="col-body" data-body="fixed"></div>
    </div>
    <div class="col" data-status="wontfix">
      <div class="col-head"><span>Won't Fix</span><span class="col-count" data-count="wontfix">0</span></div>
      <div class="col-body" data-body="wontfix"></div>
    </div>
  </div>
</div>

<footer>Built by Ayotunde Aleem — QA Engineer, Lagos, Nigeria</footer>

<div class="overlay" id="overlay">
  <div class="modal-wrap">
    <div class="modal" id="modal"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'defect-tracker-demo-bugs';
  const STATUSES = ['new', 'in-progress', 'fixed', 'wontfix'];
  const STATUS_LABELS = { 'new': 'New', 'in-progress': 'In Progress', 'fixed': 'Fixed', 'wontfix': "Won't Fix" };

  let bugs = [];
  let counter = 1;
  let editingId = null;

  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        bugs = parsed.bugs || [];
        counter = parsed.counter || 1;
      }
    } catch(e){ bugs = []; counter = 1; }
  }

  function save(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ bugs, counter }));
    } catch(e){ /* storage unavailable, fail silently */ }
  }

  const SAMPLE = [
    { title: 'Login button unresponsive on Safari mobile', severity: 'critical', status: 'new', description: 'Tapping Login does nothing on iOS Safari.', steps: '1. Open site on iPhone Safari\n2. Fill login form\n3. Tap Login', expected: 'User is logged in', actual: 'Nothing happens, no error shown' },
    { title: 'Checkout total miscalculates with discount code', severity: 'high', status: 'in-progress', description: 'Discount applies twice under certain conditions.', steps: '1. Add item to cart\n2. Apply discount code\n3. Apply it again via back button', expected: 'Discount applies once', actual: 'Discount applies twice, total goes negative' },
    { title: 'Profile avatar upload accepts .exe files', severity: 'high', status: 'new', description: 'File type validation missing on avatar upload.', steps: '1. Go to profile settings\n2. Upload a .exe file as avatar', expected: 'Upload rejected with file-type error', actual: 'File uploads successfully' },
    { title: 'Typo in password reset email subject', severity: 'low', status: 'fixed', description: 'Subject line reads "Reset Youre Password".', steps: '1. Trigger password reset\n2. Check email subject', expected: 'Correct spelling', actual: 'Typo present — now fixed' },
    { title: 'Search filter dropdown closes on scroll', severity: 'medium', status: 'wontfix', description: 'Minor UX annoyance, not a functional blocker.', steps: '1. Open search filters\n2. Scroll the results list', expected: 'Filter dropdown stays open', actual: 'Dropdown closes unexpectedly' },
  ];

  function genId(){ return 'BUG-' + String(counter++).padStart(3, '0'); }

  function render(){
    STATUSES.forEach(s => {
      const body = document.querySelector('[data-body="' + s + '"]');
      const filter = document.getElementById('severityFilter').value;
      const list = bugs.filter(b => b.status === s && (filter === 'all' || b.severity === filter));
      document.querySelector('[data-count="' + s + '"]').textContent = bugs.filter(b => b.status === s).length;
      if(list.length === 0){
        body.innerHTML = '<div class="empty-col">Nothing here</div>';
        return;
      }
      body.innerHTML = list.map(b => `
        <div class="bug-card" data-id="${b.id}">
          <div class="bug-top">
            <span class="bug-id">${b.id}</span>
            <span class="sev ${b.severity}">${b.severity}</span>
          </div>
          <div class="bug-title">${escapeHtml(b.title)}</div>
          <div class="bug-date">${b.date}</div>
        </div>
      `).join('');
    });

    document.querySelectorAll('.bug-card').forEach(card => {
      card.addEventListener('click', () => openModal(card.getAttribute('data-id')));
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openModal(id){
    editingId = id || null;
    const bug = id ? bugs.find(b => b.id === id) : {
      id: genId(), title: '', severity: 'medium', status: 'new',
      description: '', steps: '', expected: '', actual: '',
      date: new Date().toISOString().slice(0,10),
    };

    document.getElementById('modal').innerHTML = `
      <button class="close-x" id="closeModal">✕</button>
      <span class="bug-id">${bug.id}</span>
      <h2>${id ? 'Edit Defect' : 'Log a New Defect'}</h2>
      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" value="${escapeHtml(bug.title)}" placeholder="Short summary of the bug">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Severity</label>
          <select id="f-severity">
            ${['critical','high','medium','low'].map(s => `<option value="${s}" ${bug.severity===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            ${STATUSES.map(s => `<option value="${s}" ${bug.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-description" placeholder="What's wrong?">${escapeHtml(bug.description)}</textarea>
      </div>
      <div class="field">
        <label>Steps to Reproduce</label>
        <textarea id="f-steps" placeholder="1. ...\n2. ...\n3. ...">${escapeHtml(bug.steps)}</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Expected Result</label>
          <textarea id="f-expected" placeholder="What should happen">${escapeHtml(bug.expected)}</textarea>
        </div>
        <div class="field">
          <label>Actual Result</label>
          <textarea id="f-actual" placeholder="What actually happens">${escapeHtml(bug.actual)}</textarea>
        </div>
      </div>
      <div class="modal-actions">
        <div>${id ? '<button class="btn" id="deleteBtn">Delete</button>' : ''}</div>
        <div class="right">
          <button class="btn" id="cancelBtn">Cancel</button>
          <button class="btn primary" id="saveBtn">${id ? 'Save changes' : 'Log defect'}</button>
        </div>
      </div>
    `;

    document.getElementById('overlay').classList.add('open');
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', () => saveBug(bug));
    if(id){
      document.getElementById('deleteBtn').addEventListener('click', () => {
        bugs = bugs.filter(b => b.id !== id);
        save(); render(); closeModal();
      });
    }
  }

  function saveBug(base){
    const title = document.getElementById('f-title').value.trim();
    if(!title){ document.getElementById('f-title').focus(); return; }
    const updated = {
      ...base,
      title,
      severity: document.getElementById('f-severity').value,
      status: document.getElementById('f-status').value,
      description: document.getElementById('f-description').value.trim(),
      steps: document.getElementById('f-steps').value.trim(),
      expected: document.getElementById('f-expected').value.trim(),
      actual: document.getElementById('f-actual').value.trim(),
    };
    const idx = bugs.findIndex(b => b.id === updated.id);
    if(idx >= 0){ bugs[idx] = updated; } else { bugs.push(updated); }
    save(); render(); closeModal();
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('open');
    editingId = null;
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeModal();
  });

  document.getElementById('newBugBtn').addEventListener('click', () => openModal(null));
  document.getElementById('severityFilter').addEventListener('change', render);

  document.getElementById('exportBtn').addEventListener('click', () => {
    const header = 'ID,Title,Severity,Status,Description,Steps,Expected,Actual,Date\n';
    const rows = bugs.map(b =>
      [b.id, b.title, b.severity, STATUS_LABELS[b.status], b.description, b.steps, b.expected, b.actual, b.date]
        .map(f => '"' + String(f || '').replace(/"/g, '""') + '"')
        .join(',')
    ).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'defects.csv'; a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('seedBtn').addEventListener('click', () => {
    SAMPLE.forEach(s => bugs.push({ ...s, id: genId(), date: new Date().toISOString().slice(0,10) }));
    save(); render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('Clear all defects? This cannot be undone.')){
      bugs = []; counter = 1; save(); render();
    }
  });

  load();
  render();
</script>
</body>
</html>
